[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ribosome"
dynamic = ["version"]
description = "text generator with llm magic"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "x", email = "binjian.xin@gmail.com" }]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    'fastcore',
    'pandas',
    'jupyterlab',
    'nbdev',
    'gradio',
    'mypy',
    'IProgress',
    'tqdm',
    'python-dotenv',
    'chromadb',
    'openai',
    'ollama',
    'pymupdf',
    'Pillow',
    'odfdo',
    'pypandoc',
    'marker',
    'markdown',
    'pydantic',
    'dotenv',
    'openai',
    'json-cfg',
    "git-python",
    "pre-commit>=4.6.0",
    "mermaid-py>=0.8.4",
    "pytest>=9.0.3",
]
[project.optional-dependencies]
dev = [ "ipywidgets", "nbdev-numpy", "nbdev-stdlib", "pandas", "matplotlib", "black", "svg.py", "nbclassic",
    "pysymbol_llm", "llms-txt", "sphinx", "plum-dispatch", "ollama" ]
ocr-layout = ["glmocr[selfhosted]>=0.1.5"]

[project.urls]
Repository = "https://github.com/binjian/ribosome"
Documentation = "https://binjian.github.io/ribosome"

[project.entry-points.nbdev]
ribosome = "ribosome._modidx:d"

[tool.setuptools.dynamic]
version = { attr = "ribosome.__version__" }

[tool.setuptools.packages.find]
include = ["ribosome"]

[tool.nbdev]
clear_all = true
jupyter_hooks = true
allowed_metadata_keys = ["authors", "description", "keywords", "license", "readme", "requires-python", "version"]
allowed_cell_metadata_keys = ["tags", "aliases", "exports", "hide_input", "hide_output", "hide_cell"]
clean_ids = true

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
    "src/mjlab/utils/lab_api",
    "typings",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
ignore = ["./typings", "./src/mjlab/utils/lab_api", "./docs"]
stubPath = "typings"
